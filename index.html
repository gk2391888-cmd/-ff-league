<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF LEAUGE - Tournament</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0a0e1a;color:white}
.header{background:#11182c;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ffcc00}
.logo{font-weight:900;font-size:22px;color:#ffcc00;letter-spacing:1px}
.btn{padding:12px 20px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-yellow{background:#ffcc00;color:black;width:100%;margin-top:10px}
.card{background:#151c32;border:1px solid #1e2a4a;border-radius:16px;padding:18px;margin-bottom:15px}
input{width:100%;padding:13px;background:#0a0e1a;border:1px solid #1e2a4a;border-radius:10px;color:white;margin:6px 0}
.main{max-width:500px;margin:0 auto;padding:16px;padding-bottom:80px}
.t-badge{background:#ffcc0022;color:#ffcc00;padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid #ffcc00}
</style>
</head>
<body>
<div class="header"><div class="logo">FF LEAUGE</div><button onclick="login()" id="loginBtn" class="btn" style="background:#1e2a4a;color:white;padding:8px 14px">Login</button></div>
<div class="main">
<div class="card" style="background:linear-gradient(135deg,#ffcc00,#ff8800);color:black;text-align:center"><h2>🔥 FREE FIRE TOURNAMENT</h2><p style="font-size:13px;margin-top:6px">Join & Win Cash Prize Daily</p><h1 style="margin-top:10px">₹5000 PRIZE</h1></div>

<div id="tournaments"></div>

<div class="card">
<h3>💳 Add Money / Join</h3>
<p style="font-size:11px;opacity:.6;margin:8px 0">UPI ID: ffleauge@upi<br>Payment karke UTR dalo</p>
<input id="utr" placeholder="Enter UTR / Transaction ID">
<input id="ffid" placeholder="Free Fire ID">
<button class="btn-yellow" onclick="joinTournament()">Submit & Join</button>
<p id="status" style="font-size:12px;margin-top:10px;text-align:center"></p>
</div>

<div class="card">
<h3>📋 My Joined Matches</h3>
<div id="myMatches" style="font-size:13px;margin-top:10px;opacity:.7">Login karke join karo</div>
</div>
</div>

<script>
// YOUR CORRECT CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAd9e5eLTZkxVyimuJFoCV_M_RflsFlQHc",
  authDomain: "ff-leauge.firebaseapp.com",
  databaseURL: "https://ff-leauge-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ff-leauge",
  storageBucket: "ff-leauge.firebasestorage.app",
  messagingSenderId: "26073423984",
  appId: "1:26073423984:web:a4c56728df0aca79ec14b5",
  measurementId: "G-J65B23P84F"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
let currentUser = null;

// Auto Login Check
auth.onAuthStateChanged(u=>{
  if(u){ currentUser=u; document.getElementById('loginBtn').innerText = u.email.split('@')[0]; loadMyMatches(); }
});

function login(){
  let provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res=>{
    currentUser=res.user;
    alert("Logged in: "+res.user.email);
    location.reload();
  }).catch(e=>alert(e.message));
}

// Load Tournaments
db.ref('tournaments').on('value',snap=>{
  let div=document.getElementById('tournaments');
  div.innerHTML='';
  if(!snap.exists()){
    // create default tournament if none
    db.ref('tournaments').push({title:'Daily Solo - 6PM',type:'Solo',entry:30,prize:1000,time:'Today 6PM',map:'Bermuda'});
    return;
  }
  snap.forEach(c=>{
    let t=c.val();
    div.innerHTML+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.title}</b><span class="t-badge">${t.type}</span></div><div style="display:flex;gap:10px;margin-top:10px;font-size:12px"><span>💰 ₹${t.prize}</span><span>🎫 ₹${t.entry}</span><span>🗺️ ${t.map}</span></div><div style="margin-top:8px;font-size:11px;opacity:.6">⏰ ${t.time}</div><button class="btn-yellow" onclick="selectT('${c.key}')">Join Now</button></div>`;
  });
});

let selectedT = null;
function selectT(id){ selectedT=id; document.getElementById('status').innerText="Selected: "+id+" - Ab UTR dalo"; window.scrollTo(0,500); }

function joinTournament(){
  if(!currentUser) return alert('Pehle Login karo!');
  let utr=document.getElementById('utr').value.trim();
  let ffid=document.getElementById('ffid').value.trim();
  if(!utr||!ffid||!selectedT) return alert('Tournament select karo + UTR + FF ID dalo');
  db.ref('joins').push({uid:currentUser.uid,email:currentUser.email,utr:utr,ffid:ffid,tournamentId:selectedT,time:Date.now(),status:'pending'});
  document.getElementById('status').innerText="✅ Submitted! Admin approve karega 5 min me";
  document.getElementById('status').style.color="#22c55e";
  alert("Request sent!");
}

function loadMyMatches(){
  if(!currentUser) return;
  db.ref('joins').orderByChild('uid').equalTo(currentUser.uid).on('value',snap=>{
    let div=document.getElementById('myMatches');
    div.innerHTML='';
    if(!snap.exists()) div.innerHTML='No joins yet';
    snap.forEach(c=>{
      let j=c.val();
      div.innerHTML+=`<div style="background:#0a0e1a;padding:10px;border-radius:10px;margin-top:8px">🎮 ${j.tournamentId} | FF ID:${j.ffid} | Status:<b style="color:${j.status=='approved'?'#22c55e':'#ffcc00'}"> ${j.status}</b></div>`;
    });
  });
}
</script>
</body>
</html>
