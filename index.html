<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF LEAGUE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#080a10;color:white;overflow-x:hidden}
.header{background:linear-gradient(180deg,#151821,#0d0f18);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ff1a1a44;position:sticky;top:0;z-index:100}
.logo{font-family:'Orbitron';font-weight:900;font-size:22px;display:flex;align-items:center;gap:6px}
.logo i{color:#ff1a1a}
.logo .ff{color:#ff1a1a} .logo .league{color:white}
.hero{padding:18px 16px;background:radial-gradient(ellipse at top, #1a0a0a 0%, #080a10 70%);border-bottom:1px solid #ff1a1a22}
.hero h4{color:#ff1a1a;font-size:11px;letter-spacing:2px;font-weight:800}
.hero h1{font-family:'Orbitron';font-size:32px;font-weight:900;line-height:1.1;margin-top:6px}
.hero h1 span{color:#ff1a1a}
.hero p{font-size:11px;opacity:.6;margin-top:8px}
.stats{display:flex;background:#12131d;border:1px solid #ff1a1a33;border-radius:12px;padding:12px;margin-top:16px;justify-content:space-between}
.stats div{display:flex;align-items:center;gap:6px;font-size:11px}
.stats b{font-size:13px}
.active-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
.live-badge{background:#ff1a1a;color:white;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800}
.card{background:linear-gradient(180deg,#151821 0%, #10121a 100%);border:1px solid #ff1a1a44;border-radius:18px;margin:12px 16px;padding:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#ff1a1a,#ff1a1a00)}
.t-top{display:flex;justify-content:space-between;align-items:center}
.t-type{background:#ff1a1a;color:white;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:6px}
.t-live{background:#22c55e;color:white;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:800}
.t-title{font-family:'Orbitron';font-size:16px;font-weight:800;margin-top:10px;letter-spacing:.5px}
.t-map{background:#0a0c14;padding:8px 10px;border-radius:10px;font-size:11px;margin-top:10px;display:flex;align-items:center;gap:6px;opacity:.7}
.t-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;border-top:1px solid #ffffff0a;padding-top:12px}
.t-info small{font-size:9px;opacity:.5;display:block} .t-info b{font-size:15px}
.progress{height:6px;background:#1a1d2a;border-radius:10px;margin-top:10px;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,#ff1a1a,#ff4444);border-radius:10px}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;font-weight:800;font-size:12px;border:none;cursor:pointer}
.btn-outline{background:transparent;border:1px solid #ff1a1a66;color:#ff1a1a}
.btn-red{background:linear-gradient(90deg,#ff1a1a,#cc0000);color:white}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f111c;border-top:1px solid #ff1a1a33;display:flex;justify-content:space-around;padding:10px 0 16px;z-index:100}
.b-item{text-align:center;opacity:.5;font-size:9px;font-weight:700;cursor:pointer}
.b-item.active{opacity:1;color:#ff1a1a}
.b-item i{font-size:20px;display:block;margin-bottom:4px}
input{width:100%;padding:12px;background:#0a0c14;border:1px solid #2a2d3d;border-radius:10px;color:white;margin:6px 0}
#joinModal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:end}
#joinModal.open{display:flex}
.modal-box{background:#151821;width:100%;border-radius:22px 22px 0 0;padding:18px;border-top:1px solid #ff1a1a}
</style>
</head>
<body>
<div class="header">
<div class="logo"><i class="fa-solid fa-fire-flame-curved"></i> <span class="ff">FF</span><span class="league">LEAGUE</span></div>
<div style="display:flex;gap:14px;font-size:18px"><i class="fa-solid fa-bell"></i><i class="fa-solid fa-wallet"></i><i class="fa-solid fa-headset"></i></div>
</div>

<div class="hero">
<h4>PRO ESPORTS TOURNAMENTS</h4>
<h1>COMPETE. WIN. <span>EARN.</span></h1>
<p>Live tournaments for Free Fire - Join now and claim rewards</p>
<div class="stats">
<div><i class="fa-solid fa-wallet" style="color:#ff1a1a"></i> <span>Balance:<br><b id="balance">$250.00</b></span></div>
<div><i class="fa-solid fa-trophy" style="color:#ff1a1a"></i> <span>Wins:<br><b id="wins">12</b></span></div>
<div><i class="fa-solid fa-gem" style="color:#ff1a1a"></i> <span><b>Diamond II</b></span></div>
</div>
</div>

<div class="active-head"><h3>Active Tournaments</h3><span class="live-badge">All • 2 Live</span></div>

<div id="list"></div>

<!-- Join Modal -->
<div id="joinModal" onclick="closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<h3 id="modalTitle">Join Tournament</h3>
<p id="modalFee" style="font-size:12px;opacity:.6;margin:6px 0"></p>
<input id="ffuid" placeholder="Free Fire UID">
<input id="ffname" placeholder="In-Game Name">
<input id="utr" placeholder="UTR / Txn ID (UPI Payment)">
<div style="background:#0a0c14;padding:10px;border-radius:10px;font-size:11px;margin:8px 0">UPI: <b style="color:#ff1a1a">ffleauge@okaxis</b> - ₹ bhejo aur UTR dalo</div>
<button class="btn btn-red" style="width:100%" onclick="confirmJoin()">CONFIRM JOIN <i class="fa-solid fa-arrow-right"></i></button>
<p id="jStatus" style="font-size:11px;text-align:center;margin-top:8px"></p>
</div>
</div>

<div style="height:80px"></div>
<div class="bottom">
<div class="b-item active"><i class="fa-solid fa-house"></i>Home</div>
<div class="b-item"><i class="fa-solid fa-trophy"></i>Tournaments</div>
<div class="b-item"><i class="fa-solid fa-circle-play"></i>Live</div>
<div class="b-item"><i class="fa-solid fa-wallet"></i>Wallet</div>
<div class="b-item" onclick="login()"><i class="fa-solid fa-user"></i>Profile</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAd9e5eLTZkxVyimuJFoCV_M_RflsFlQHc",
  authDomain: "ff-leauge.firebaseapp.com",
  databaseURL: "https://ff-leauge-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ff-leauge",
  storageBucket: "ff-leauge.firebasestorage.app",
  messagingSenderId: "26073423984",
  appId: "1:26073423984:web:a4c56728df0aca79ec14b5",
  measurementId: "G-J65B23P84F"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();
let currentUser=null;
let selected=null;

auth.onAuthStateChanged(u=>{ if(u) currentUser=u; });

function login(){
  let p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).then(r=>{ currentUser=r.user; alert('Logged in '+r.user.email); });
}

let tournaments=[
  {id:'247',type:'SOLO',title:'SOLO — RUSH CLASH #247',map:'Bermuda',time:'Starts in 12:34',entry:5,prize:1500,slots:87,total:100,status:'LIVE'},
  {id:'112',type:'SQUAD',title:'SQUAD — TEAM DOMINATION #112',map:'Purgatory',time:'Starts in 45:20',entry:20,prize:5000,slots:32,total:64,status:'REGISTRATION'}
];

function render(){
  let html='';
  tournaments.forEach(t=>{
    html+=`<div class="card">
      <div class="t-top"><span class="t-type"><i class="fa-solid fa-crosshairs"></i> ${t.type}</span><span class="${t.status==='LIVE'?'t-live':''} live-badge" style="${t.status!=='LIVE'?'background:#ff9900':''}">${t.status}</span></div>
      <div class="t-title">${t.title}</div>
      <div class="t-map"><i class="fa-solid fa-location-dot"></i> Map: ${t.map} • ${t.time}</div>
      <div class="t-info">
        <div><small><i class="fa-solid fa-sack-dollar" style="color:#ff1a1a"></i> Entry Fee</small><b>$${t.entry}.00</b></div>
        <div><small><i class="fa-solid fa-trophy" style="color:#ff1a1a"></i> Prize Pool</small><b style="color:#ff1a1a">$${t.prize.toLocaleString()}</b></div>
        <div><small><i class="fa-solid fa-users" style="color:#ff1a1a"></i> Slots Filled</small><b>${t.slots}/${t.total}</b></div>
      </div>
      <div class="progress"><div style="width:${(t.slots/t.total*100)}%"></div></div>
      <div class="btns"><button class="btn btn-outline"><i class="fa-solid fa-wallet"></i> PAY $${t.entry}.00</button><button class="btn btn-red" onclick="openJoin('${t.id}')">JOIN NOW <i class="fa-solid fa-chevron-right"></i></button></div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html;
}
render();

function openJoin(id){
  if(!currentUser){ alert('Pehle Login karo!'); login(); return; }
  selected=tournaments.find(x=>x.id===id);
  document.getElementById('modalTitle').innerText=selected.title;
  document.getElementById('modalFee').innerText=`Entry: $${selected.entry} | Prize: $${selected.prize}`;
  document.getElementById('joinModal').classList.add('open');
}
function closeModal(){ document.getElementById('joinModal').classList.remove('open'); }

function confirmJoin(){
  let uid=document.getElementById('ffuid').value.trim();
  let name=document.getElementById('ffname').value.trim();
  let utr=document.getElementById('utr').value.trim();
  if(!uid||!name||!utr) return alert('Sab bharo!');
  document.getElementById('jStatus').innerText='Submitting...';
  db.ref('joins').push({uid:currentUser.uid,email:currentUser.email,ffuid:uid,ffname:name,utr:utr,tournamentId:selected.id,title:selected.title,time:Date.now(),status:'pending'}).then(()=>{
    document.getElementById('jStatus').innerHTML='<span style="color:#22c55e">✅ Joined! Admin approve karega</span>';
    setTimeout(closeModal,1500);
  });
}

// Auto countdown
setInterval(()=>{
  // demo timer update
},1000);
</script>
</body>
</html>
